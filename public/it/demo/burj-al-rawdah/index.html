<!-- 25/11 (Nico): the Riyadh tower of «20 Torre arabo Choose your floor» (the LINE-X tower, photo B with the glass of Burj Al Waha)
     on the site, in the same look as Burj Al Waha: the 4K photo, every floor measured on it (25 levels, 4 to 28, gardens and loggia),
     the floor lit with the photo's own pixels (lights on + a thread of light on the edge, the rest a touch darker), the Concierge card
     at the bottom, and a click flies the camera close to that floor. The walk inside comes when its clips exist. -->
<style>

#stage img.on{opacity:1}
#stage canvas{opacity:0;pointer-events:none}
#stage canvas.l{mix-blend-mode:plus-lighter}
body.hov{cursor:pointer}

/* top left: the name of the tower, like Burj Al Waha */
.brand{position:fixed;z-index:5;left:calc(max(64px * 1, 18px) + env(safe-area-inset-left,0px));top:max(calc(56 * var(--px)), 14px);display:flex;align-items:center;gap:calc(22 * var(--px));pointer-events:none;
  text-shadow:0 1px 18px rgba(0,0,0,.35);opacity:0;transform:translateY(-6px);transition:opacity .9s ease .3s,transform .9s ease .3s}
.brand.on{opacity:1;transform:none}
.brand .ar{font:400 max(calc(40 * var(--px)), 20px)/1 "Diwan Thuluth","Geeza Pro","Noto Naskh Arabic",serif;color:var(--av);direction:rtl}
.brand .sep{width:1px;height:max(calc(46 * var(--px)), 22px);background:var(--line)}

  height:max(calc(132 * var(--px)), 64px);display:flex;align-items:center;border-radius:max(calc(14 * var(--px)), 8px);

  opacity:0;transform:translateY(10px);transition:opacity .6s ease,transform .6s ease}

.card .go{flex:none;margin:0 max(calc(30 * var(--px)), 10px) 0 max(calc(18 * var(--px)), 8px);height:max(calc(64 * var(--px)), 34px);padding:0 max(calc(34 * var(--px)), 14px);border:0;border-radius:999px;cursor:pointer;

.veil small{display:block;margin-top:14px;font:600 11px/1 var(--sans);letter-spacing:.32em;text-transform:uppercase;color:rgba(246,236,214,.7);font-style:normal}
.veil.off{opacity:0;visibility:hidden}
.rotate{display:none}
@media (orientation:portrait) and (pointer:coarse){

.oc{top:max(14px,env(safe-area-inset-top,0px))!important;bottom:auto!important}

  }
