<style>
  :root {

    --ink-dim: rgba(244, 239, 232, .68);

    --warm: #ffcf8a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0b1118; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }

  .clip { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
  .clip.on { opacity: 1; }

  svg.floors { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity .4s; }
  .floor path.hit { fill: transparent; cursor: pointer; }

  .floor text { fill: var(--ink); font-size: 22px; font-weight: 300; }
  .floor.hover line, .floor.hover text { opacity: 1; }

  /* Apple-style glass: clear, heavy blur, thin bright rim, no fill colour */
  .glass {

    background: rgba(255, 255, 255, .10);
    -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%);

  .glass::before { /* specular sheen along the top edge */
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;

  .pill { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 999px; font-size: 15px; font-weight: 500; letter-spacing: -.01em; color: #fff; transition: transform .2s ease, background .2s ease, opacity .4s ease; }
  .pill:hover { background: rgba(255,255,255,.18); }
  .pill:active { transform: scale(.97); }
  /* solid Apple buttons: blue for going forward, white for everything else */
  .btn-blue, .btn-white { -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: 0 6px 20px rgba(0,0,0,.22); font-weight: 600; }
  .btn-blue::before, .btn-white::before { display: none; }
  .btn-blue { background: #0a84ff; color: #fff; }
  .btn-blue:hover { background: #2a95ff; }
  .btn-white { background: #fff; color: #1d1d1f; }
  .btn-white:hover { background: #f2f2f4; }

  /* top bar */
  .bar { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 24px 32px; z-index: 5; }

  .back { display: none; }
  .back.on { display: inline-flex; }

  /* choose your floor panel */
  .panel { position: fixed; right: 5vw; top: 50%; transform: translateY(-50%); width: min(340px, 86vw); padding: 30px 28px 24px; border-radius: 30px; z-index: 4; background: rgba(20, 24, 30, .18); }
  .panel h1 { font-weight: 600; font-size: 34px; line-height: 1.05; letter-spacing: -.025em; }
  .panel p.lead { margin-top: 10px; font-size: 14px; line-height: 1.45; color: rgba(255,255,255,.75); }
  .level { margin-top: 26px; display: flex; align-items: baseline; gap: 12px; }
  .level small { font-size: 13px; font-weight: 500; color: rgba(255,255,255,.7); }
  .level .num { font-size: 68px; font-weight: 600; line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
  .unit { margin-top: 6px; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .meta { margin-top: 2px; font-size: 14px; color: rgba(255,255,255,.7); min-height: 2.6em; line-height: 1.4; }
  .enter { margin-top: 18px; width: 100%; height: 48px; font-size: 16px; font-weight: 600; }
  .enter[disabled] { background: rgba(255,255,255,.22); color: rgba(255,255,255,.8); box-shadow: none; cursor: default; }

  /* room caption */
  .caption { position: fixed; left: 5vw; bottom: 8vh; z-index: 4; padding: 16px 24px 18px; border-radius: 26px; opacity: 0; transform: translateY(12px); transition: opacity .6s, transform .6s; pointer-events: none; }
  .caption.on { opacity: 1; transform: none; }
  .caption small { display: block; font-size: 13px; font-weight: 500; color: rgba(255,255,255,.72); }
  .caption h2 { margin-top: 2px; font-weight: 600; font-size: 34px; line-height: 1.1; letter-spacing: -.025em; }

  /* hotspot pills on the footage */
  .spot { position: fixed; left: 0; top: 0; z-index: 4; transform: translate(-50%, -50%); opacity: 0; pointer-events: none; padding: 0 18px 0 14px; }
  .spot.on { opacity: 1; pointer-events: auto; }
  .spot:active { transform: translate(-50%, -50%) scale(.97); }
  .spot i { position: relative; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .spot i::before { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 1px solid currentColor; opacity: 0; animation: ping 2.4s infinite; }

  @keyframes ping { 0% { transform: scale(.6); opacity: .8; } 100% { transform: scale(1.6); opacity: 0; } }

  .finale { position: fixed; inset: 0; z-index: 3; display: grid; place-items: center; pointer-events: none; }

  .finale h3 { font-weight: 600; font-size: clamp(34px, 6.4vw, 96px); letter-spacing: .28em; padding-left: .28em; line-height: 1; text-align: center; color: #fff; text-shadow: 0 2px 40px rgba(0,0,0,.25); }

  .loader { position: fixed; left: clamp(20px, 4vw, 56px); bottom: clamp(20px, 5vh, 56px); z-index: 50; pointer-events: none; color: #fff; transition: transform .9s cubic-bezier(.6,0,.2,1), opacity .7s; }

  g.addEventListener('click', () => { if (TOUCH && !g.classList.contains('hover')) { pick(f, g); return; } pick(f, g); fly(); });
  f.el = g; svg.appendChild(g);
});

const $ = id => document.getElementById(id);
let current = null;
function pick(f, g) {
  floors.forEach(x => x.el.classList.toggle('hover', x === f));
  if (f === current) return;
  current = f;
  const num = $('num');
  gsap.fromTo(num, { yPercent: 30, opacity: 0 }, { yPercent: 0, opacity: 1, duration: .35, ease: 'power2.out' });
  num.textContent = f.n;
  $('unit').textContent = f.unit;
  $('meta').textContent = `${f.area} m² · ${f.out}`;
  $('enter').disabled = false;
  $('enter').textContent = `Entra al piano ${f.n}`;
}
pick(floors[ACTIVE - 1]);
floors[ACTIVE - 1].el.classList.remove('hover');
svg.addEventListener('mouseleave', () => floors.forEach(x => x.el.classList.remove('hover')));

// ---- clips ----
// Only the original footage: forward clips play as they are; each return is one clip made of the
// same original frames in reverse, with slow stretches thinned so the camera never stalls.
const CLIPS = {
  fly: 'assets/fly.mp4', enter: 'assets/enter.mp4', bath: 'assets/bath.mp4',
  'back-terrace': 'assets/back-terrace.mp4', 'back-living': 'assets/back-living.mp4', 'back-bath': 'assets/back-bath.mp4',
};
// Web version (8/11): one clip at a time, in the order you watch them. The flight comes first and the
// tower is usable as soon as it is in; the others load while you look around. Each clip still goes
// fully into memory before it plays, so nothing stalls mid-move.
const ORDER = ['fly', 'enter', 'back-terrace', 'bath', 'back-living', 'back-bath'];
let ready = 0;
const total = ORDER.length;
const loaded = {};
ORDER.forEach(id => { let r; loaded[id] = new Promise(res => (r = res)); loaded[id].done = r; });
async function grab(src, onPct) {
  const res = await fetch(src);
  const len = +res.headers.get('content-length') || 0;
  if (!len || !res.body || !onPct) return res.blob();
  const reader = res.body.getReader(), parts = []; let got = 0;
  for (;;) { const { done, value } = await reader.read(); if (done) break; parts.push(value); got += value.length; onPct(got / len); }
  return new Blob(parts, { type: 'video/mp4' });
}
window.OmnyaLoad && OmnyaLoad.watch();   // no progress for 25 s = a card that says to reload
(async () => {
  for (const id of ORDER) {
    const blob = await grab(CLIPS[id], id === 'fly' ? p => { $('pct').textContent = Math.min(99, Math.floor(p * 100)); } : null);
    const v = $('v-' + id);
    v.src = URL.createObjectURL(blob);
    v.load();
    // 12/11: really ready to show (iPhone may never say "loadeddata" for a video that is not playing)
    await (window.OmnyaLoad ? OmnyaLoad.ready(v) : new Promise(res => v.addEventListener('loadeddata', res, { once: true })));
    ready++;
    if (id === 'fly') {
      $('pct').textContent = 100;
      window.OmnyaLoad && OmnyaLoad.done();
      setTimeout(() => {
        $('loader').classList.add('out'); $('veil').style.opacity = 0;
        document.body.classList.add('reveal'); document.body.classList.remove('loading');
        setTimeout(() => { document.body.classList.remove('reveal'); $('loader').remove(); $('veil').remove(); }, 1000);
      }, 350);
    }
    loaded[id].done();
  }
})();
let showing = $('v-fly');   // the tower is the flight's first frame
function swapTo(el) {
  el.classList.add('on');
  if (showing && showing !== el) { const old = showing; requestAnimationFrame(() => requestAnimationFrame(() => old.classList.remove('on'))); }
  showing = el;
}
async function play(id, onStart, rate = 1) {
  if (ready < total) await loaded[id];   // a clip still on its way: wait for it, then go
  const v = $('v-' + id);
  v.playbackRate = rate;
  return new Promise(resolve => {
    v.pause(); v.currentTime = 0;
    const start = () => {
      swapTo(v); v.play();
      if (onStart) onStart(v);
      v.addEventListener('ended', () => resolve(), { once: true });
    };
    if (v.readyState >= 2 && !v.seeking) start(); else v.addEventListener('seeked', start, { once: true });
  });
}

// place hotspots on frame coordinates, whatever the window shape
function placeSpots() {
  const iw = 1920, ih = 1080, s = Math.max(innerWidth / iw, innerHeight / ih);
  const ox = (innerWidth - iw * s) / 2, oy = (innerHeight - ih * s) / 2;
  document.querySelectorAll('.spot').forEach(el => {
    el.style.left = (ox + el.dataset.u * iw * s) + 'px';
    el.style.top = (oy + el.dataset.v * ih * s) + 'px';
  });
}
placeSpots(); addEventListener('resize', placeSpots);

let state = 'tower', busy = false;
function captions(id) {
  document.querySelectorAll('.caption, .spot').forEach(c => c.classList.remove('on', 'selected'));
  if (id) $(id).classList.add('on');
}

async function fly() {
  if (busy || state !== 'tower') return;
  busy = true;
  gsap.to(['#panel', '#floors'], { opacity: 0, duration: .4, onComplete: () => { $('panel').style.pointerEvents = 'none'; $('floors').style.pointerEvents = 'none'; } });
  $('back').classList.add('on');
  document.querySelectorAll('.lvl').forEach(el => el.textContent = `Piano ${current.n}`);
  await play('fly');
  state = 'esterno'; busy = false; captions('cap-esterno'); $('spot-in').classList.add('on');
}
$('enter').addEventListener('click', () => fly());

$('spot-in').addEventListener('click', async () => {
  if (busy || state !== 'esterno') return;
  busy = true; captions();
  await play('enter');
  state = 'interno'; busy = false; captions('cap-interno'); $('spot-bagno').classList.add('on');
});
$('spot-bagno').addEventListener('click', async () => {
  if (busy || state !== 'interno') return;
  busy = true; captions();
  await play('bath');
  state = 'bagno'; busy = false; captions('cap-bagno');
});

// back: the same footage in reverse, room by room, to the tower; the logo builds up on the last stretch
$('back').addEventListener('click', async () => {
  if (busy || !['esterno', 'interno', 'bagno'].includes(state)) return;
  busy = true; captions();
  gsap.to('#brand', { opacity: 0, duration: .6 });
  // one continuous clip per starting room (original frames, reversed, evened out): no stops on the way
  const id = { esterno: 'back-terrace', interno: 'back-living', bagno: 'back-bath' }[state];
  await play(id, v => { const d = v.duration, lead = d * .55; gsap.delayedCall(d - lead, () => finale(lead)); });
  state = 'end'; busy = false; $('back').classList.remove('on'); $('restart').classList.add('on');
});

// closing title: SAMAR RESIDENCES, letter by letter, only at the end of the return
function finale(dur) {
  return gsap.timeline()
    .fromTo('#finale-logo', { opacity: 0, y: 30, scale: .94, filter: 'blur(14px) drop-shadow(0 4px 30px rgba(0,0,0,.3))' },
      { opacity: 1, y: 0, scale: 1, filter: 'blur(0px) drop-shadow(0 4px 30px rgba(0,0,0,.3))', duration: dur, ease: 'power2.out' })
    .fromTo('#finale-sub', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: dur * .6, ease: 'power2.out' }, dur * .4);
}
// back to the very beginning: clear the title, bring the floor picker back
$('restart').addEventListener('click', () => {
  if (state !== 'end') return;
  $('restart').classList.remove('on');
  gsap.to(['#finale-logo', '#finale-sub'], { opacity: 0, duration: .5, ease: 'power2.in', onComplete: () => {
    state = 'tower';
    $('panel').style.pointerEvents = ''; $('floors').style.pointerEvents = '';
    pick(floors[ACTIVE - 1]); floors.forEach(x => x.el.classList.remove('hover'));
    gsap.to(['#panel', '#floors', '#brand'], { opacity: 1, duration: .6 });
  } });
});
</script>

<script defer src="/demo/cta.js"></script>
