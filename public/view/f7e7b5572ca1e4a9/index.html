/* Terminal per il cliente (27/11, Nico): il giro v13 della villa 27 a tutto schermo, il cliente sceglie da solo.
   Il logo Omnya Lab è bruciato dentro ogni video (al centro, come /demo/mark.js): non si toglie dalla pagina.

   un file video per tratto, due lettori che si passano il testimone così non si blocca.

:root{
  --bg:#0e0f11; --panel:#17181b; --line:#2a2c31; --fg:#eceae6; --muted:#9a9890; --accent:#3f8a5f; --accent-2:#96d2aa;

}
body{background:var(--bg);color:var(--fg);font-family:var(--text);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 72px;display:grid;gap:18px}
header h1{font-family:var(--title);font-weight:600;font-size:clamp(26px,4vw,38px);letter-spacing:-.01em;margin:0 0 6px;text-wrap:balance}
header p{margin:0;color:var(--muted);max-width:80ch}
button{font:inherit;font-size:14px;color:var(--fg);background:#22242a;border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}
button:hover{border-color:#4a4d55}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.bar .sp{flex:1}
.bar .stato{font-size:14px;color:var(--accent-2);font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;min-width:0}
.box h2{font-family:var(--title);font-size:19px;margin:0}
.box ol,.box ul{margin:0;padding-left:1.2em;display:grid;gap:6px;color:var(--muted);font-size:14px}
.box b{color:var(--fg);font-weight:600}
.box li.on{color:var(--fg)}
.box li.on::marker{color:var(--accent-2)}
.k{display:inline-block;font:600 12.5px var(--title);color:#fff;background:rgba(63,138,95,.9);border-radius:999px;padding:1px 9px;margin-left:4px;white-space:nowrap}
/* ---------- il terminal ---------- */
.stage{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:#000;container-type:inline-size;user-select:none;-webkit-user-select:none}
.stage video,.stage img.fermo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:100% 50%}
.stage video{opacity:0}
.stage video.vis{opacity:1}
.ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.veil,.grad{position:absolute;inset:0}
.grad{background:linear-gradient(to top,rgba(0,0,0,.5) 0%,rgba(0,0,0,.14) 36%,rgba(0,0,0,0) 60%);opacity:0}
.lb{position:absolute;left:0;top:0;color:#fff;text-shadow:0 .1cqw 1.25cqw rgba(0,0,0,.35);opacity:0;white-space:nowrap}
.eyebrow{font:500 1.09cqw var(--text);letter-spacing:.34em;text-transform:uppercase;opacity:.9}
.t1{font:500 4.48cqw var(--title);letter-spacing:-.015em;line-height:1.02;margin-top:.6cqw}
.t1.m{font-size:3.33cqw}
.t2{font:400 1.46cqw var(--text);opacity:.9;margin-top:.95cqw}
.pills{position:absolute;left:0;top:0;display:flex;gap:.9cqw;opacity:0}
.pill{height:3.65cqw;padding:0 2.3cqw;border-radius:1.82cqw;background:rgba(63,138,95,.94);color:#fff;border:0;

.pills.on .pill{pointer-events:auto}
.pill:hover{background:rgba(76,160,112,.98);transform:translateY(-.1cqw)}
.pill.press{transform:scale(.95)}

.pin.dim{opacity:.55}
.pin.h{transform:scale(1.45);background:var(--accent);color:#fff;opacity:1;z-index:2;box-shadow:0 0 0 .22cqw #fff,0 0 1.6cqw rgba(63,138,95,.9)}
.pin.h::after{content:"";position:absolute;inset:-.5cqw;border-radius:50%;border:.14cqw solid rgba(150,210,170,.9);animation:onda 1.3s ease-out infinite}
@keyframes onda{from{transform:scale(.8);opacity:1}to{transform:scale(1.9);opacity:0}}
.pin.via{transform:scale(0);opacity:0}
.pin.scelto{transform:scale(1.9);background:var(--accent);color:#fff;box-shadow:0 0 0 .22cqw #fff,0 0 2.4cqw rgba(63,138,95,1)}
.card{position:absolute;left:0;top:0;width:15.6cqw;padding:1.04cqw 1.35cqw;box-sizing:border-box;border-radius:1.15cqw;background:rgba(12,12,14,.55);
  border:.1cqw solid rgba(255,255,255,.24);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;opacity:0;pointer-events:none;transition:opacity .15s}
.card .av{font:500 .89cqw var(--text);letter-spacing:.06em;color:var(--accent-2)}
.card .nr{font:500 2.29cqw var(--title);margin-top:.2cqw;line-height:1.05}
.card .sb{font:400 1.09cqw var(--text);color:#e6e6e6;margin-top:.4cqw}
.card .go{font:600 .99cqw var(--text);color:var(--accent-2);margin-top:.7cqw}
.card .pd{position:absolute;right:1.25cqw;top:1.15cqw;width:.83cqw;height:.83cqw;border-radius:50%;background:var(--accent)}
.hint{position:absolute;left:5.5%;bottom:7%;color:#fff;font:500 1.15cqw var(--text);letter-spacing:.02em;opacity:0;transition:opacity .4s;text-shadow:0 .1cqw .8cqw rgba(0,0,0,.4)}
.wait{position:absolute;right:2.2cqw;top:2.2cqw;width:2.2cqw;height:2.2cqw;border-radius:50%;border:.25cqw solid rgba(255,255,255,.25);border-top-color:#fff;animation:gira .8s linear infinite;opacity:0}
@keyframes gira{to{transform:rotate(360deg)}}
.tap{position:absolute;inset:0;display:none;place-items:center;background:rgba(0,0,0,.35);pointer-events:auto;cursor:pointer}
.tap span{font:600 1.6cqw var(--title);color:#fff;background:rgba(63,138,95,.94);padding:1cqw 2.2cqw;border-radius:2cqw}

/* tutto schermo: il quadro 16:9 più grande che entra, centrato sul nero */
html,body{margin:0;height:100%;background:#000}
.full{min-height:100vh;min-height:100dvh;display:grid;place-items:center;align-content:center;gap:14px;padding:0}
.full .stage{width:min(100vw,177.78vh);width:min(100vw,177.78dvh);border-radius:0}
.rot{display:none;margin:0;color:#9a9890;font:500 14px var(--text);text-align:center}
@media (orientation:portrait) and (max-width:820px){.rot{display:block}}
@media (prefers-reduced-motion:reduce){.pin,.pill{transition:none}.pin.h::after{animation:none}}
</style>

  const [x0,y0]=VILLE[i]; pins.forEach((p,j)=>{p.classList.remove('dim'); if(j===i){p.classList.remove('h'); p.classList.add('scelto')} else {const [x,y]=VILLE[j]; setTimeout(()=>p.classList.add('via'),Math.hypot(x-x0,y-y0)*0.45)}});
  setTimeout(()=>{pins[i].classList.add('via'); avvia('discesa')},700)}
pins.forEach((p,i)=>{p.addEventListener('mouseenter',()=>{if(S.fase==='villa'&&!AUTO)hover(i)}); p.addEventListener('mouseleave',()=>{if(S.fase==='villa'&&!AUTO)hover(-1)});
  p.addEventListener('click',()=>scegli(i))});

function disegna(){const n=ora(); let veil=0,grad=0;
  if(S.fase==='villa'||S.fase==='scelta'){veil=VELO_ALTO/VELO; lb.style.opacity=0; pills.style.opacity=0; pills.classList.remove('on');
    if(AUTO&&S.fase==='villa'){const u=n-S.autoT, k27=VILLE.findIndex(v=>v[4]); const giro=[[0.8,VILLE.findIndex(v=>v[3]===25)],[1.6,VILLE.findIndex(v=>v[3]===28)],[2.4,k27]];
      let h=-1; for(const [tt,i] of giro) if(u>tt) h=i; if(h!==S.hov) hover(h); if(u>3.6) scegli(k27)}
    setStato(S.fase==='villa'?'Scegli una villa':'Villa scelta');
  } else {
    const P=PASSI[S.passo], v=vids[cur], t=v.currentTime||0, dur=v.duration||99;
    if(S.fase==='va'&&!S.attesa&&(v.ended||t>=dur-0.05)){v.pause(); S.fase='fermo'; S.fermoT=n; bottoni(P.btn)}
    const L=P.lab, giu=L.giu??0.8, gl=L.gl??1.4;
    if(S.tLab===null&&!S.attesa&&t>=L.at) S.tLab=n;
    const tl=S.tLab===null?-1:n-S.tLab, o=tl<0?0:ss(tl/0.6);   // Nico 27/11: la scritta esce direttamente in basso a sinistra, col velo al 34%
    const fuori=S.fase==='esce'?1-ss((n-S.via)/0.3):1;
    const pos=etichetta(o*fuori,1);
    veil=o*fuori; grad=o*fuori;
    if(S.passo==='discesa') veil=Math.max(veil,(VELO_ALTO/VELO)*(1-ss((n-S.t0)/0.6)));
    const pronto=S.fase!=='va'&&o>0.97;
    const bo=pronto?(S.fase==='esce'?fuori:ss((n-Math.max(S.fermoT||n,(S.tLab||n)+0.6))/0.3)):0;
    if(pronto){const t1=lb.querySelector('.t1'); pills.style.transform=`translate(${pos.x+t1.offsetWidth+0.025*Wd()}px,${pos.y+t1.offsetTop+t1.offsetHeight/2-pills.offsetHeight/2+(1-bo)*0.008*Wd()}px)`}
    pills.style.opacity=bo.toFixed(3); pills.classList.toggle('on',bo>0.9&&S.fase==='fermo');
    if(AUTO&&S.fase==='fermo'&&bo>0.99&&n-S.fermoT>2.2){const bs=[...pills.querySelectorAll('.pill')]; const b=(P.pre&&bs.find(x=>x.dataset.to===P.pre))||bs[bs.length-1]; if(b) premi(b)}   // in automatico prende l'ultimo bottone (all'ingresso: Bedroom)
    // camera: immagine spostata a destra, il muro a sinistra non si vede (K8b da 5,88 s, K9 da 7,46 s)
    // camera: entrando l'immagine va a destra (niente muro a sinistra, K8b da 3,46 s); guardando fuori torna piano a tutto quadro (Nico: troppo zoom sulla finestra)
    if(P.zoom==='bed'){const z=t<3.46?1:1+0.22*ss((t-3.46)/0.79); v.style.transform=`scale(${z.toFixed(4)})`}
    else if(P.zoom==='vista'){const z=1.18-0.18*ss(t/1.8); v.style.transform=`scale(${z.toFixed(4)})`} else v.style.transform='';
    setStato(S.fase==='fermo'?`${P.nome} · premi ${P.btn[0][0]}`:P.nome);
  }
  document.getElementById('wait').style.opacity=S.attesa?1:0;
  const ve=st.querySelector('.veil'); ve.style.background=`rgba(6,7,9,${(VELO*veil).toFixed(3)})`; ve.style.backdropFilter=ve.style.webkitBackdropFilter=`blur(${(1.2*veil*Wd()/1920).toFixed(2)}px)`;
  st.querySelector('.grad').style.opacity=(0.85*grad).toFixed(3);
  requestAnimationFrame(disegna)}
function etichetta(o,m){const w=lb.offsetWidth,h=lb.offsetHeight,t1=lb.querySelector('.t1'),cy=t1.offsetTop+t1.offsetHeight/2;
  const x=lerp((Wd()-w)/2,0.055*Wd(),m), y=lerp(Hd()/2-cy,Hd()-0.09*Hd()-h,m);
  lb.style.opacity=o.toFixed(3); lb.style.transform=`translate(${x}px,${y+(1-Math.min(1,o*2))*0.013*Wd()}px)`; return {x,y}}
function setStato(){}

ricomincia(); requestAnimationFrame(disegna);
</script>
