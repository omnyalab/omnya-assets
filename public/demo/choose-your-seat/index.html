<style>
/* Stadio, versione vera: foto e clip Kling, arancio sotto il mouse, biglietti. Tutte le misure del palco in cqw */
:root{
  --or:#ff7a12; --ink:#121317; --paper:#fbfaf7; --gold:#d8b27a; --ok:#21a35b; --few:#e07a00; --no:#d23b3b;
  --disp:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  --body:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
}
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:default}
*{cursor:default!important;box-sizing:border-box}
#app{position:fixed;inset:0;overflow:hidden}
#app>.stage{position:absolute;left:50%;top:50%;translate:-50% -50%}
.stage{position:relative;flex:none;width:max(100vw,177.78vh);aspect-ratio:16/9;container-type:inline-size;overflow:hidden;background:#000;font-family:var(--body);color:var(--ink);user-select:none}
#cv,#vd{position:absolute;inset:0;width:100%;height:100%;display:block}
#vd{opacity:0}
#vd.on{opacity:1}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.42);backdrop-filter:blur(.3cqw);-webkit-backdrop-filter:blur(.3cqw);opacity:0;transition:opacity .6s;pointer-events:none}
.dim.on{opacity:1}
.k{font-size:1.05cqw;letter-spacing:.12em;text-transform:uppercase;color:#8a8f99;font-weight:600;display:block}

/* biglietto piccolo */
.tk{position:absolute;left:50%;top:50%;opacity:0;transform:translate(-50%,-100%) translateY(1.2cqw) rotate(-2deg);transition:opacity .22s, transform .5s cubic-bezier(.2,1.4,.35,1);display:flex;filter:drop-shadow(0 1cqw 2cqw rgba(0,0,0,.35));white-space:nowrap;pointer-events:none;z-index:5}
.tk.on{opacity:1;transform:translate(-50%,-100%) rotate(0)}
.tk .a,.tk .s{background:var(--paper);padding:1cqw 1.4cqw;display:grid;align-content:center}
.tk .a{border-radius:1.1cqw 0 0 1.1cqw;grid-auto-flow:column;gap:1.1cqw;align-items:center}
.tk .s{border-left:.18cqw dashed #c9ccd3;border-radius:0 1.1cqw 1.1cqw 0;justify-items:center;min-width:7.6cqw}
.tk b{font-family:var(--disp);font-size:2.4cqw;line-height:1.05;letter-spacing:-.01em;display:block}
.tk .s b{font-size:2.1cqw;color:var(--or)}
.tk.sold .s b{color:#9aa0aa}
.tk .av{font-size:1.25cqw;font-weight:700;margin-top:.25cqw;display:flex;align-items:center;gap:.5cqw}
.tk .av:before{content:"";width:.75cqw;height:.75cqw;border-radius:50%;background:currentColor}
.av.ok{color:var(--ok)}.av.few{color:var(--few)}.av.no{color:var(--no)}
.tk .th{width:0;height:5cqw;border-radius:.7cqw;object-fit:cover;transition:width .4s cubic-bezier(.2,1.2,.3,1)}
.tk.wv .th{width:8.8cqw}

/* biglietto grande */
.big{position:absolute;left:50%;top:50%;perspective:140cqw;opacity:0;transform:translate(-50%,-44%) rotate(-3deg) scale(.92);transition:opacity .35s, transform .8s cubic-bezier(.2,1.25,.3,1);z-index:6;pointer-events:none}
.big.on{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.big,.acts{scale:var(--fit,1)}
.fin{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.55,0,.2,1.12)}
.big.turn .fin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:1.8cqw;overflow:hidden;box-shadow:0 2.4cqw 6cqw rgba(0,0,0,.5)}
.face.f2{transform:rotateY(180deg)}
.big:not(.turn) .f2,.big.turn .f1{pointer-events:none}
.btn{border-radius:999px;padding:.8cqw 1.8cqw;font-weight:700;font-size:1.5cqw;background:var(--or);color:#fff;transition:transform .12s, filter .15s;white-space:nowrap;display:inline-block;border:0;font-family:var(--body)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.94)}
.btn.ghost{background:transparent;color:inherit;opacity:.65;padding:.8cqw .8cqw}
.btns{display:flex;align-items:center;gap:.6cqw}
.ns{display:grid;gap:.45cqw;justify-items:start}
.f2 .ns .k{color:var(--gold)}
.bars{display:flex;gap:.2cqw;height:3cqw;align-items:stretch}
.bars i{display:block;background:currentColor;width:.2cqw}
.bars i:nth-child(3n){width:.45cqw}.bars i:nth-child(5n){width:.1cqw}.bars i:nth-child(7n){width:.32cqw}
.chip{position:absolute;left:1.2cqw;top:1.2cqw;display:flex;align-items:center;gap:.6cqw;background:rgba(10,10,12,.55);backdrop-filter:blur(1cqw);-webkit-backdrop-filter:blur(1cqw);color:#fff;border-radius:999px;padding:.5cqw 1.1cqw;font-size:1.25cqw;font-weight:600;z-index:2}
.chip i{width:.8cqw;height:.8cqw;border-radius:50%;background:var(--or);box-shadow:0 0 .9cqw var(--or)}
.view{position:relative;overflow:hidden}
.view img{width:100%;height:100%;object-fit:cover;display:block}
.fld{display:grid;gap:.1cqw}
.fld b{font-family:var(--disp);font-size:3.2cqw;line-height:1;letter-spacing:-.02em}
.row3{display:flex;gap:2.4cqw}

/* B1 wallet */
.B1 .big{width:30cqw;height:48cqw}
.B1 .face{background:var(--paper);display:grid;grid-template-rows:auto 21cqw auto 1fr}
.B1 .hd{display:flex;justify-content:space-between;align-items:center;padding:1.4cqw 1.8cqw}
.B1 .hd b{font-family:var(--disp);font-size:1.7cqw}
.B1 .hd span{font-size:1.4cqw;color:var(--or);font-weight:700}
.B1 .bd{padding:1.4cqw 1.8cqw;display:grid;gap:1.1cqw}
.B1 .ft{border-top:.18cqw dashed #cfd2d8;padding:1.2cqw 1.8cqw;display:flex;justify-content:space-between;align-items:center}
.B1 .f2{background:linear-gradient(160deg,#1a1a1e,#2b2520);color:#f3e7d6}
.B1 .f2 .hd span,.B1 .f2 .k{color:var(--gold)}
.B1 .f2 .btn{background:#f3e7d6;color:#17171b}
/* B2 classico */
.B2 .big{width:62cqw;height:25cqw}
.B2 .face{background:var(--paper);display:grid;grid-template-columns:27cqw 1fr 12cqw}
.B2 .mid{padding:1.8cqw 2cqw;display:grid;align-content:space-between}
.B2 .btn:not(.ghost){font-size:1.42cqw;padding:.8cqw 1.45cqw}
.B2 .btns{flex-direction:column;align-items:flex-start;gap:.1cqw}
.B2 .btns .ghost{padding:.4cqw 0 0 .4cqw;font-size:1.35cqw}
.B2 .face{grid-template-columns:27cqw minmax(0,1fr) 12cqw!important}
.B2 .mid .t b{font-family:var(--disp);font-size:2.3cqw;display:block;margin-top:.2cqw}
.B2 .stub{border-left:.2cqw dashed #cfd2d8;display:grid;align-content:space-between;justify-items:center;padding:1.8cqw 1cqw}
.B2 .stub .bars{transform:rotate(90deg);width:8cqw;height:4cqw;margin:2cqw 0}
.B2 .stub b{font-family:var(--disp);font-size:2.4cqw;color:var(--or)}
.B2 .f2{background:linear-gradient(135deg,#17171b,#2b2520);color:#f3e7d6}
.B2 .f2 .k{color:var(--gold)}.B2 .f2 .stub b{color:var(--gold)}
.B2 .f2 .btn{background:#f3e7d6;color:#17171b}
/* B3 foto */
.B3 .big{width:60cqw;height:28cqw}
.B3 .face{display:grid;grid-template-columns:1fr 13cqw;background:var(--paper)}
.B3 .view::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.72))}
.B3 .ov{position:absolute;left:2cqw;right:2cqw;bottom:1.8cqw;z-index:2;color:#fff;display:flex;justify-content:space-between;align-items:end}
.B3 .ov .k{color:rgba(255,255,255,.72)}
.B3 .ov .fld b{font-size:3.4cqw}
.B3 .stub{border-left:.2cqw dashed #cfd2d8;display:grid;align-content:space-between;justify-items:center;padding:1.8cqw 1cqw;text-align:center}
.B3 .stub b{font-family:var(--disp);font-size:2.4cqw;color:var(--or);display:block}
.B3 .stub .bars{transform:rotate(90deg);width:7cqw;height:4cqw;margin:1.4cqw 0}
.B3 .f2 .stub{background:#1b1a1d;color:#f3e7d6}
.B3 .f2 .stub b,.B3 .f2 .stub .k{color:var(--gold)}
.B3 .ov .btn.ghost{color:#fff}

/* pillola in basso */
.pill{position:absolute;left:50%;bottom:calc(4cqw + var(--cy,0cqw));transform:translate(-50%,2cqw);opacity:0;transition:opacity .3s, transform .5s cubic-bezier(.2,1.3,.35,1);background:var(--paper);color:var(--ink);border-radius:999px;padding:1cqw 2.2cqw;font-weight:700;font-size:1.7cqw;box-shadow:0 1cqw 3cqw rgba(0,0,0,.35);pointer-events:none;border:0;font-family:var(--body);z-index:7}
.pill.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.pill:active{transform:translate(-50%,0) scale(.95)}
.stamp{position:absolute;right:3cqw;top:2cqw;transform:rotate(-12deg) scale(1.6);opacity:0;border:.35cqw solid var(--ok);color:var(--ok);border-radius:1cqw;padding:.4cqw 1.2cqw;font-family:var(--disp);font-weight:800;font-size:2.4cqw;letter-spacing:.06em;transition:opacity .2s, transform .35s cubic-bezier(.2,1.6,.4,1);z-index:3;background:rgba(255,255,255,.85)}
.stamp.on{opacity:1;transform:rotate(-12deg) scale(1)}

#load{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:600 1.6cqw var(--body);background:#000;z-index:20;transition:opacity .5s}
#load.off{opacity:0;pointer-events:none}
#load span{opacity:.6}
/* sito (16/11): numero grande come le altre demo, poi la foto dall'alto */
#load{background:#000 url(assets/s1.jpg) center/cover no-repeat}
#load::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55)}
.loader{position:fixed;left:clamp(20px,4vw,56px);bottom:clamp(20px,5vh,56px);z-index:50;pointer-events:none;color:#fff;font-family:var(--body);transition:transform .9s cubic-bezier(.6,0,.2,1),opacity .7s}
.loader p{margin:0 0 6px;font-size:15px;letter-spacing:.01em;color:rgba(255,255,255,.8)}
.loader b{display:block;font-size:clamp(110px,17vw,240px);line-height:.82;font-weight:500;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.loader b small{font-size:.32em;letter-spacing:-.02em;margin-left:6px;vertical-align:.95em;color:var(--or)}
.loader.out{transform:translateY(-30px);opacity:0}
.hint{position:absolute;left:50%;bottom:calc(3.2cqw + var(--cy,0cqw));transform:translate(-50%,1cqw);opacity:0;transition:opacity .4s,transform .6s cubic-bezier(.2,1.3,.35,1);z-index:7;pointer-events:none;padding:1cqw 2cqw;border-radius:999px;color:#fff;font:600 max(13px,1.35cqw) var(--body);letter-spacing:-.01em;white-space:nowrap;background:rgba(14,18,24,.42);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.45),0 8px 30px rgba(0,0,0,.25)}
.hint.on{opacity:1;transform:translate(-50%,0)}
.wait{position:absolute;left:50%;top:50%;width:3.4cqw;height:3.4cqw;margin:-1.7cqw 0 0 -1.7cqw;border-radius:50%;border:.35cqw solid rgba(255,255,255,.25);border-top-color:#fff;opacity:0;transition:opacity .3s;z-index:8;pointer-events:none;animation:spin 1s linear infinite}
.wait.on{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.rotate{display:none}
@media (orientation:portrait) and (max-width:760px){
  .rotate{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:#0b1118;text-align:center;color:#fff;font-family:var(--body)}
  .rotate div{font-size:17px;font-weight:600;letter-spacing:-.01em}
  .rotate i{display:block;width:46px;height:78px;margin:0 auto 22px;border:2px solid #fff;border-radius:10px;animation:turn 2.2s ease-in-out infinite}
  .rotate small{display:block;margin-top:6px;font-size:14px;font-weight:400;color:rgba(255,255,255,.62)}
  .loader{z-index:46}
}
@keyframes turn{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
/* giro automatico (?auto=1): cursore disegnato, il vero è nascosto */
.auto,.auto *{cursor:none!important}
#cur{position:absolute;left:0;top:0;width:1.75cqw;z-index:30;pointer-events:none;opacity:0;transition:opacity .35s;transform-origin:8% 6%;filter:drop-shadow(0 .12cqw .25cqw rgba(0,0,0,.45))}
#cur.on{opacity:1}
#cur svg{display:block;width:100%;height:auto;transition:transform .12s}
#cur.prs svg{transform:scale(.84)}
.btn.hov{filter:brightness(1.08)}
.btn.prs{transform:scale(.94)}
.pill.hov{filter:brightness(.97)}
/* scelta sull'altra vista: confermi o scegli un altro posto */
.acts{position:absolute;left:50%;bottom:calc(4cqw + var(--cy,0cqw));transform:translate(-50%,2cqw);opacity:0;transition:opacity .3s, transform .5s cubic-bezier(.2,1.3,.35,1);display:flex;gap:1cqw;z-index:7;pointer-events:none}
.acts.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.acts button{border:0;border-radius:999px;padding:1cqw 2.2cqw;font:700 1.7cqw var(--body);box-shadow:0 1cqw 3cqw rgba(0,0,0,.35);transition:transform .12s, filter .15s;white-space:nowrap}
.acts .ok{background:var(--or);color:#fff}
.acts .again{background:var(--paper);color:var(--ink)}
.acts button:hover,.acts button.hov{filter:brightness(1.06)}
.acts button:active,.acts button.prs{transform:scale(.94)}
</style>
</head>
<body>
<div id="app"><div class="stage" id="st">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <video id="vd" muted playsinline preload="auto"></video>
  <div class="dim" id="dim"></div>
  <div class="tk" id="tk"><div class="a"><img class="th" src="assets/v_seat.jpg" alt=""><div><span class="k" id="t1"></span><b id="t2"></b><div class="av" id="t4"></div></div></div><div class="s"><span class="k" id="t5">AED</span><b id="t3"></b></div></div>
  <div class="big" id="big"><div class="fin" id="fin"></div></div>
  <button class="pill" id="pill"></button>
  <div class="acts" id="acts"><button class="ok" data-b="ok">Confirm ticket</button><button class="again" data-b="again">Choose another seat</button></div>
  <div id="cur"><svg viewBox="0 0 20 30"><path d="M1.5 1.5 L1.5 23.5 L6.6 18.6 L10 27 L13.6 25.5 L10.3 17.4 L17.3 17.4 Z" fill="#000" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
  <div id="load"></div>
  <div class="hint" id="hint"></div>
  <div class="wait" id="wait"></div>
</div></div>
<div class="rotate"><div><i></i>Turn your phone<small>This stadium is best seen in landscape</small></div></div>
<div class="loader" id="loader" role="status" aria-live="polite"><p>Choose your seat · loading</p><b><span id="pct">0</span><small>%</small></b></div>

<script>
// ---------- dati ----------
const Q=new URLSearchParams(location.search);
const AUTO=Q.get('auto')==='1';
const VAR=(Q.get('t')||'B2').toUpperCase();          // biglietto: B1 wallet, B2 classico, B3 foto
document.getElementById('st').classList.add(VAR);
const ZN={6:'North Stand',2:'South Stand',0:'East Stand',4:'West Stand',7:'North-East Corner',1:'South-East Corner',3:'South-West Corner',5:'North-West Corner'};
const ZP={6:1250,2:1250,0:650,4:650,7:850,1:850,3:850,5:850};
const ZL={6:48,2:212,0:340,4:0,7:96,1:130,3:75,5:12};
const ZGATE={6:'N3',2:'S1',0:'E2',4:'W2',7:'NE',1:'SE',3:'SW',5:'NW'};
const TIER={0:['Lower tier',1450],1:['Middle tier',1250],2:['Upper tier',850]};
const CHOSEN_ZONE=6, CHOSEN_BLOCK=232;
const fmt=n=>n.toLocaleString('en-US');
const avail=n=>n<=0?['Sold out','no']:n<=20?[n+' left','few']:[n+' left','ok'];
const blockLeft=n=>n===CHOSEN_BLOCK?48:(n%11===3?0:((n*37)%140)+6);
const seatFree=(i,pick)=>pick||((i*73+11)%9===0);
const BAR='<div class="bars">'+'<i></i>'.repeat(30)+'</div>';

// ---------- caricamento ----------
const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d',{willReadFrequently:true}),vd=$('vd');
function img(src,n=0){return new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>n<4?setTimeout(()=>img(src,n+1).then(ok,ko),300*(n+1)):ko(new Error('assets/'+src));i.src='assets/'+src+(n?'?r='+n:'')})}
function pixels(i){const c=document.createElement('canvas');c.width=1920;c.height=1080;const x=c.getContext('2d');x.drawImage(i,0,0);return x.getImageData(0,0,1920,1080).data}
async function blob(src){for(let n=0;;n++){try{const r=await fetch('assets/'+src);if(!r.ok)throw new Error(r.status);return URL.createObjectURL(await r.blob())}catch(e){if(n>=4)throw new Error('assets/'+src);await new Promise(t=>setTimeout(t,300*(n+1)))}}}
const L={},V={};let META;
const PHONE=matchMedia('(pointer: coarse)').matches;   // dito: il primo tocco accende, il secondo entra
const SMALL=PHONE&&Math.min(screen.width,screen.height)<820;   // telefono: clip 720p
const clipFile=n=>n+(SMALL?'_m':'')+'.mp4';
const PV={};const getV=n=>PV[n]||(PV[n]=blob(clipFile(n)).then(u=>V[n]=u));
let DONE=0,TOTAL=1;const tickLoad=p=>p.then(r=>{DONE++;$('pct').textContent=Math.min(99,Math.round(DONE/TOTAL*100));return r});
async function loadRest(){for(const v of ['C2_or','C2','C3_or','C4','C5_or_1','C5_or_2','C5_or_3','C5_or_4','C5_or_5','C5_or_6','C5_or_7','C5_or_8','C6','C7','C3','C5'])try{await getV(v)}catch(e){}}
async function loadAll(){
  TOTAL=5*5+4+2;
  META=await (await fetch('assets/meta.json')).json();
  const names=['s1','s2','s3','s4','s5'];
  await Promise.all(names.map(async n=>{
    const [b,o,g,id,alf]=await Promise.all([n+'.jpg',n+'_or.jpg',n+'_gr.jpg',n+'_id.png',n+'_al.png'].map(f=>tickLoad(img(f))));
    const P={base:pixels(b),or:pixels(o),gr:pixels(g)};
    // la mappa dei pezzi: R+G = numero (PNG senza alfa), _al = quanto colore
    const c=document.createElement('canvas');c.width=1920;c.height=1080;const x=c.getContext('2d');x.drawImage(id,0,0);
    const d=x.getImageData(0,0,1920,1080).data;const da=pixels(alf);const N=d.length/4;const ids=new Uint16Array(N),al=new Uint8Array(N);
    const lists={};
    for(let p=0;p<N;p++){const v=d[p*4]+d[p*4+1]*256;ids[p]=v;al[p]=da[p*4];if(v&&da[p*4]>0)(lists[v]=lists[v]||[]).push(p)}
    for(const k in lists)lists[k]=Int32Array.from(lists[k]);

    P.ids=ids;P.al=al;P.lists=lists;L[n]=P;
  }));
  L.s3.pk=pixels(await tickLoad(img('s3_pk.jpg')));
  const bk=pixels(await tickLoad(img('s3_block.png')));L.s3.block=new Uint8Array(bk.length/4);for(let p=0;p<L.s3.block.length;p++)L.s3.block[p]=bk[p*4];
  L.s3.blockList=Int32Array.from([...L.s3.block.keys()].filter(p=>L.s3.block[p]>0));
  await Promise.all([tickLoad(getV('C1_or')),tickLoad(getV('C1')),tickLoad(img('v_seat.jpg')),tickLoad(img('v_vip.jpg'))]);
}

// ---------- disegno: foto + arancio/grigio sui pezzi ----------
let cur='s1',W={},G={},BW=0,raf=0;   // W: peso arancio per pezzo, G: peso grigio, BW: arancio su tutto il blocco
const out=cx.createImageData(1920,1080);
function draw(){

if(Q.get('rec')){
  document.getElementById('load').style.display='none';   // nel video niente scritta di caricamento
  let T=0,seq=0;const tm=new Map(),rafs=[],A=new Map(),rST=window.setTimeout.bind(window);
  const seek=t=>Math.abs(vd.currentTime-t)<1e-4?Promise.resolve():new Promise(r=>{const done=()=>{vd.onseeked=null;r()};vd.onseeked=done;rST(done,3000);vd.currentTime=t});
  window.setTimeout=(f,ms=0)=>{const id=++seq;tm.set(id,{t:T+Math.max(0,ms),f});return id};window.clearTimeout=id=>tm.delete(id);
  window.requestAnimationFrame=f=>{rafs.push(f);return rafs.length};performance.now=()=>T;
  const P=HTMLMediaElement.prototype;let vs=null,ended=false;
  P.play=function(){vs=T;ended=false;return Promise.resolve()};
  function css(){document.body.offsetWidth;for(const a of document.getAnimations()){if(!A.has(a)){A.set(a,T);a.pause()}const t=T-A.get(a);try{a.currentTime=t}catch(e){}}}
  window.__step=async ms=>{T+=ms;
    for(let n=0;n<50;n++){const due=[...tm].filter(([,o])=>o.t<=T).sort((a,b)=>a[1].t-b[1].t);if(!due.length)break;for(const [id,o] of due){if(tm.delete(id))o.f()}await Promise.resolve();await new Promise(r=>queueMicrotask(r))}
    const fs=rafs.splice(0);for(const f of fs)f(T);
    if(vs!==null&&!ended&&vd.duration){const t=(T-vs)/1000;
      if(t>=vd.duration-1/48){ended=true;vs=null;await seek(vd.duration-0.02);const f=vd.onended;if(f)f()}
      else await seek(t+0.002)}
    css();return T};
}
